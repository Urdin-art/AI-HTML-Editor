<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer Test</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; color: #333; padding: 2em; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2em; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #555; }
        #file-list, #results { border: 1px solid #ddd; padding: 1em; margin-top: 1em; border-radius: 4px; }
        #results-image { margin-top: 1em; max-width: 100%; border: 2px dashed #ccc; padding: 5px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 1em; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; }
        input[type=number], input[type=file] { padding: 10px; border-radius: 4px; border: 1px solid #ddd; margin-right: 1em; }
        pre { background: #eee; padding: 1em; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Image Resizer Test</h1>
        
        <h2>1. Upload Image to 'resources'</h2>
        <input type="file" id="file-upload" accept="image/*">
        <button id="upload-btn">Upload</button>
        <p id="upload-status"></p>

        <h2>2. Select Image and Dimensions</h2>
        <div id="file-list">
            <p>Upload an image to see it here.</p>
        </div>
        <div id="controls" style="margin-top: 1em; display: none;">
            <label>Width: <input type="number" id="width-input" value="200"></label>
            <label>Height: <input type="number" id="height-input" value="200"></label>
            <button id="resize-btn">Resize Selected Image</button>
        </div>

        <h2>3. Results</h2>
        <pre id="results"><p>Resize results will appear here.</p></pre>
        <img id="results-image" src="" alt="Resized image will appear here" style="display: none;"/>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM fully loaded and parsed. Initializing script...');

            const uploadBtn = document.getElementById('upload-btn');
            const fileInput = document.getElementById('file-upload');
            const uploadStatus = document.getElementById('upload-status');
            const fileListDiv = document.getElementById('file-list');
            const controlsDiv = document.getElementById('controls');
            const resizeBtn = document.getElementById('resize-btn');
            const widthInput = document.getElementById('width-input');
            const heightInput = document.getElementById('height-input');
            const resultsPre = document.getElementById('results');
            const resultsImage = document.getElementById('results-image');

            if (!uploadBtn || !fileInput || !uploadStatus) {
                console.error('Initialization failed: A required upload element is missing.');
                if(uploadStatus) uploadStatus.textContent = 'Page Error: Could not find required elements.';
                return;
            }
            console.log('All elements found. Attaching event listeners.');

            let lastUploadedFile = null;

            uploadBtn.addEventListener('click', async () => {
                console.log('Upload button clicked.');
                if (fileInput.files.length === 0) {
                    uploadStatus.textContent = 'Please select a file first.';
                    console.log('No file selected.');
                    return;
                }
                const file = fileInput.files[0];
                const formData = new FormData();
                formData.append('file', file);

                uploadStatus.textContent = 'Uploading...';
                uploadBtn.disabled = true;

                try {
                    const response = await fetch('/api/upload.php', { method: 'POST', body: formData });
                    if (!response.ok) {
                        let errorMsg = 'Upload failed with status: ' + response.status;
                        try {
                            const res = await response.json();
                            errorMsg = res.message || errorMsg;
                        } catch (e) {
                            // Ignore if response is not json
                        }
                        throw new Error(errorMsg);
                    }
                    lastUploadedFile = { name: file.name, path: `resources/${file.name}` };
                    uploadStatus.textContent = `Successfully uploaded ${file.name}!`;
                    renderFileList();
                } catch (error) {
                    uploadStatus.textContent = `Upload error: ${error.message}`;
                    console.error('Upload error:', error);
                } finally {
                    uploadBtn.disabled = false;
                }
            });

            function renderFileList() {
                if (!lastUploadedFile) return;
                fileListDiv.innerHTML = `
                    <label>
                        <input type=\"radio\" name=\"source-file\" value=\"_path_${lastUploadedFile.path}\" checked> 
                        ${lastUploadedFile.name}
                    </label>
                `;
                controlsDiv.style.display = 'block';
            }

            resizeBtn.addEventListener('click', async () => {
                console.log('Resize button clicked.');
                const selectedRadio = document.querySelector('input[name=source-file]:checked');
                if (!selectedRadio) {
                    resultsPre.textContent = 'No image selected.';
                    return;
                }

                const sourceFile = selectedRadio.value.replace('_path_','');
                const width = parseInt(widthInput.value, 10);
                const height = parseInt(heightInput.value, 10);

                resultsPre.textContent = 'Resizing... Please wait.';
                resultsImage.style.display = 'none';
                resizeBtn.disabled = true;

                try {
                    const response = await fetch('/api/resize_test.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sourceFile, width, height })
                    });
                    const result = await response.json();
                    resultsPre.textContent = JSON.stringify(result, null, 2);

                    if (result.success && result.new_path_relative) {
                        resultsImage.src = `${result.new_path_relative}?t=${new Date().getTime()}`;
                        resultsImage.style.display = 'block';
                    }

                } catch (error) {
                    resultsPre.textContent = `An error occurred:\n${error.message}`;
                    console.error('Resize error:', error);
                } finally {
                    resizeBtn.disabled = false;
                }
            });
        });
    </script>

</body>
</html>
